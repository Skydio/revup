[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["build", ".eggs"]

[tool.ruff.lint]
# Keep ruff's default rules (E, F) and also run import sorting (I), modern annotation
# syntax (UP006, UP007, UP045, UP037) and the future import it needs on py38 (FA102).
extend-select = ["I", "UP006", "UP007", "UP037", "UP045", "FA102"]

[tool.ruff.lint.isort]
known-first-party = ["revup"]

[tool.coverage.run]
# Keep the coverage data file out of the repo root.
data_file = "build/.coverage"
